<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Robin Fadel illustrated portfolio page featuring a palace and flower garden scene." />
    <title>Robin Fadel — Illustrated by Robin</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <div class="title">illustrated by robin</div>

      <section class="scene" aria-label="Illustrated palace and garden scene">
        <div class="palace-wrap">
          <div class="palace">
            <div class="dome dome-main">
              <div class="dome-crest"></div>
            </div>

            <div class="minaret left-one"></div>
            <div class="minaret left-two"></div>
            <div class="minaret right-one"></div>
            <div class="minaret right-two"></div>

            <div class="facade-top"></div>
            <div class="arch arch-left"></div>
            <div class="arch arch-center"></div>
            <div class="arch arch-right"></div>
            <div class="arch arch-right-most"></div>
          </div>
        </div>

        <div class="garden">
          <div class="path"></div>

          <div class="flowers flower-a"></div>
          <div class="flowers flower-b"></div>
          <div class="flowers flower-c"></div>
          <div class="flowers flower-d"></div>
          <div class="flowers flower-e"></div>
          <div class="flowers flower-f"></div>
          <div class="flowers flower-g"></div>
          <div class="flowers flower-h"></div>
          <div class="flowers flower-i"></div>
          <div class="flowers flower-j"></div>
        </div>
      </section>
    </main>
  </body>
</html>
